<script>/* =========================================================================
   MOTOR DE SIMULACIÓN CONTABLE
   Genera, de forma determinista (semilla), la vida de una empresa ficticia
   desde su año de creación hasta hoy y la registra en un libro diario con
   cuentas del Plan General Contable (PGC) simplificado.
   ========================================================================= */
(function (root) {
'use strict';

const PGC = {
  '100': 'Capital social', '101': 'Fondo social (capital del empresario)', '170': 'Deudas a largo plazo con entidades de crédito',
  '213': 'Maquinaria', '216': 'Mobiliario', '217': 'Equipos para procesos de información', '260': 'Fianzas constituidas a largo plazo',
  '281': 'Amortización acumulada del inmovilizado material', '300': 'Mercaderías',
  '430': 'Clientes', '4700': 'H.P. deudora por IVA', '472': 'H.P. IVA soportado', '473': 'H.P. retenciones y pagos a cuenta',
  '477': 'H.P. IVA repercutido', '4750': 'H.P. acreedora por IVA', '4751': 'H.P. acreedora por retenciones practicadas',
  '4752': 'H.P. acreedora por Impuesto sobre Sociedades', '551': 'Cuenta del titular (retiros, IRPF y pagos fraccionados)',
  '572': 'Bancos c/c',
  '600': 'Consumo de mercaderías (coste de ventas)', '602': 'Compras de otros aprovisionamientos (materiales y consumibles)',
  '621': 'Arrendamientos y cánones', '623': 'Servicios de profesionales independientes (gestoría)', '624': 'Transportes y desplazamientos',
  '625': 'Primas de seguros', '627': 'Publicidad y propaganda', '628': 'Suministros', '629': 'Otros servicios',
  '630': 'Impuesto sobre beneficios', '634': 'Ajustes negativos en IVA (IVA no deducible)',
  '640': 'Sueldos y salarios', '642': 'Seguridad Social a cargo de la empresa / Cuota de autónomos',
  '662': 'Intereses de deudas', '669': 'Otros gastos financieros (descubierto)', '681': 'Amortización del inmovilizado material',
  '700': 'Ventas de mercaderías', '705': 'Prestaciones de servicios'
};
const GASTOS = ['600','602','621','623','624','625','627','628','629','634','640','642','662','669','681','630'];
const INGRESOS = ['700','705'];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const sum = a => a.reduce((x, y) => x + y, 0);

function poisson(l, R) {
  if (l <= 0) return 0;
  if (l >= 12) return Math.max(0, Math.round(l * (1 + (R() + R() + R() - 1.5) * 0.16)));
  const L = Math.exp(-l); let k = 0, p = 1;
  do { k++; p *= R(); } while (p > L);
  return k - 1;
}

function anioFiscal(F, y) { return F.anios[y] || F.anios[Math.max.apply(null, Object.keys(F.anios).map(Number))]; }

function indice(F, tipo, y, m) {
  const clave = { energia: 'var_energia', alimentacion: 'var_alimentacion', alquiler: 'var_alquiler', general: 'ipc' }[tipo] || 'ipc';
  let v = 1;
  for (let a = 2023; a < y; a++) v *= 1 + anioFiscal(F, a)[clave] / 100;
  v *= 1 + anioFiscal(F, y)[clave] / 100 * (m / 12);
  return v;
}

function cuotaTramo(F, y, rend) {
  const t = anioFiscal(F, y).cuota_autonomo;
  for (const x of t) if (x.hasta === null || rend <= x.hasta) return x.cuota;
  return t[t.length - 1].cuota;
}
function escalaIRPF(F, base) {
  let t = 0, prev = 0;
  for (const [lim, p] of F.irpf_escala) {
    const top = lim === null ? Infinity : lim;
    if (base > prev) t += (Math.min(base, top) - prev) * p / 100;
    prev = top; if (base <= top) break;
  }
  return t;
}
function minimoPersonal(F, hijos) {
  let m = F.minimo_personal;
  const h = [2400, 2700, 4000, 4500];
  for (let i = 0; i < hijos; i++) m += h[Math.min(i, 3)];
  return m;
}
function ssEmpresaPct(F, y) {
  const s = F.ss_empresa, a = anioFiscal(F, y);
  return (s.contingencias_comunes + s.desempleo + s.fogasa + s.formacion + s.at_ep + a.mei_empresa) / 100;
}
function ssTrabPct(F, y) {
  const s = F.ss_trabajador, a = anioFiscal(F, y);
  return (s.contingencias_comunes + s.desempleo + s.formacion + a.mei_trabajador) / 100;
}

/* ----------------------------------------------------------------------- */
function sectorPrincipal(D, ids) {
  const cat = D.catalogo;
  const prods = ids.map(id => cat.productos.find(p => p.id === id)).filter(Boolean);
  const conteo = {};
  prods.forEach(p => conteo[p.sector] = (conteo[p.sector] || 0) + 1);
  let principal = prods[0] ? prods[0].sector : cat.sectores[0].id;
  Object.keys(conteo).forEach(s => { if (conteo[s] > conteo[principal]) principal = s; });
  const sec = cat.sectores.find(s => s.id === principal);
  const extras = Object.keys(conteo).filter(s => s !== principal).map(s => cat.sectores.find(x => x.id === s));
  return { sec, extras, prods };
}

function simular(emp, D, hoy) {
  hoy = hoy || new Date();
  const F = D.fiscal;
  const enun = D.enunciados.find(e => e.id === emp.enunciadoId);
  const cat = D.catalogo;
  const { sec, extras, prods } = sectorPrincipal(D, emp.productos);
  const mix = key => sec[key] + 0.25 * extras.reduce((a, s) => a + s[key], 0);
  const R = mulberry32(emp.seed);
  const mod = emp.modalidad;
  const esAut = emp.forma === 'autonomo';
  const ub = enun.ubicacion;
  const startIdx = emp.anio * 12;
  const endIdx = hoy.getFullYear() * 12 + hoy.getMonth() - 1;

  const asientos = [];
  let nAs = 0, cash = 0;
  const ivaRep = {}, ivaSop = {}, ivaExenta = {}, ivaTotal = {}, retQ = {};
  const addQ = (obj, q, v) => { obj[q] = (obj[q] || 0) + v; };
  const qid = (y, m) => y * 4 + Math.floor(m / 3);

  function post(y, m, d, concepto, lineas, tag) {
    // lineas: [cuenta, debe, haber]
    let L = lineas.map(l => [l[0], r2(l[1] || 0), r2(l[2] || 0)]).filter(l => l[1] !== 0 || l[2] !== 0);
    if (!L.length) return;
    const D_ = sum(L.map(l => l[1])), H_ = sum(L.map(l => l[2]));
    const diff = r2(D_ - H_);
    if (diff !== 0) {
      let k = L.findIndex(l => l[0] === '572');
      if (k < 0) { let max = 0; L.forEach((l, i) => { if (l[1] + l[2] > L[max][1] + L[max][2]) max = i; }); k = max; }
      if (diff > 0) L[k][2] = r2(L[k][2] + diff); else L[k][1] = r2(L[k][1] - diff);
    }
    L.forEach(l => { if (l[0] === '572') cash = r2(cash + l[1] - l[2]); });
    asientos.push({ n: ++nAs, fecha: `${y}-${pad(m + 1)}-${pad(d)}`, concepto, lineas: L, tag: tag || '' });
  }

  // helper: gasto con IVA 21% (soporta) y retención opcional
  function gasto(y, m, d, concepto, cuenta, base, opts) {
    opts = opts || {};
    if (base <= 0) return 0;
    const iva = opts.exento ? 0 : r2(base * (opts.ivaPct == null ? 21 : opts.ivaPct) / 100);
    const ret = opts.ret ? r2(base * opts.ret / 100) : 0;
    const q = qid(y, m);
    const L = [[cuenta, base, 0]];
    if (iva) { L.push(['472', iva, 0]); addQ(ivaSop, q, iva); }
    if (ret) { L.push(['4751', 0, ret]); addQ(retQ, q, ret); }
    L.push(['572', 0, base + iva - ret]);
    post(y, m, d, concepto, L, opts.tag || cuenta);
    return base + iva;
  }

  // estado de inventario
  const stock = {};      // pid -> {u, v}
  const hist = {};       // pid -> [vendidas]
  prods.forEach(p => { stock[p.id] = { u: 0, v: 0 }; hist[p.id] = []; });
  const ventasProd = {}; // pid -> {unidades, ingresos, coste, porMes}
  prods.forEach(p => ventasProd[p.id] = { unidades: 0, ingresos: 0, porMes: {} });

  const afin = p => clamp(enun.afinidad[p.sector] != null ? enun.afinidad[p.sector] : 0.3, 0.1, 1.3);
  const factorAfin = p => Math.pow(afin(p), 1.6) * (p.sector === sec.id ? 1 : 0.85);
  const cityF = mod === 'local' ? ub.tier : (mod === 'online' ? 0.9 : Math.pow(ub.tier, 0.6));
  const capF = 1;

  function esperada(p, t, y, m) {
    const sc = cat.sectores.find(s => s.id === p.sector);
    const est = F.estacionalidad[p.estacionalidad] || F.estacionalidad.constante;
    const mean = sum(est) / 12;
    const tau = (mod === 'online' ? 7 : 6) - 2 * Math.min(afin(p), 1);
    const ramp = 1 - 0.65 * Math.exp(-t / tau);
    const formF = (!esAut && sc.b2b) ? 1.08 : 1;
    return p.demanda * sc.escala * factorAfin(p) * cityF * ramp * (est[m] / mean) * anioFiscal(F, y).consumo * capF * formF;
  }
  function eventoFactor(y, m) {
    let f = 1;
    (F.eventos || []).forEach(ev => {
      if (!ub.eventos || ub.eventos.indexOf(ev.id) < 0) return;
      const [ey, em] = ev.mes_inicio.split('-').map(Number);
      const k = y * 12 + m - (ey * 12 + em - 1);
      if (k >= 0 && k < ev.factores.length) {
        const base = ev.factores[k];
        f *= mod === 'online' ? 1 - (1 - base) * 0.55 : base;
      }
    });
    return f;
  }
  const ivaCompra = p => (p.tipo === 'producto' && (p.iva === 4 || p.iva === 10)) ? p.iva : 21;

  // --------------------------------------------------------------- CONSTITUCIÓN
  const y0 = emp.anio, m0 = 0;
  const pi0 = indice(F, 'ipc', y0, 0);
  const A0 = anioFiscal(F, y0);
  const capital = emp.capital, prestamo = emp.prestamo || 0;
  post(y0, m0, 1, esAut ? 'Aportación inicial del titular' : 'Constitución de la sociedad: capital social desembolsado',
    [['572', capital, 0], [esAut ? '101' : '100', 0, capital]], 'constitucion');
  let prestamoVivo = 0, cuotaPrestamo = 0, tipoPrest = 0;
  if (prestamo > 0) {
    post(y0, m0, 2, 'Préstamo bancario concedido', [['572', prestamo, 0], ['170', 0, prestamo]], 'financiacion');
    prestamoVivo = prestamo; tipoPrest = A0.tipo_prestamo / 100 / 12;
    const n = 60;
    cuotaPrestamo = tipoPrest > 0 ? prestamo * tipoPrest / (1 - Math.pow(1 + tipoPrest, -n)) : prestamo / n;
  }
  if (!esAut) gasto(y0, m0, 3, 'Gastos de constitución (notaría, registro mercantil y gestoría)', '623', A0.gastos_constitucion_sl, { exento: false });

  const rentF = mod === 'local' ? 1 : (mod === 'domicilio' && sec.modalidades[0] === 'domicilio' ? 0.5 : 0);
  const alqMes = (y, m) => mix('alquiler_base') * ub.alquiler_idx * indice(F, 'alquiler', y, m) * rentF;
  if (rentF > 0) {
    const fianza = r2(2 * alqMes(y0, 0));
    post(y0, m0, 4, 'Fianza del local de negocio (2 mensualidades)', [['260', fianza, 0], ['572', 0, fianza]], 'inmovilizado');
  }
  const invFactor = mod === 'local' ? 1 : (mod === 'online' ? 0.2 : (sec.modalidades[0] === 'domicilio' ? 1 : 0.3));
  const inversion = mix('inversion') * invFactor * pi0;
  const inv217 = r2(inversion * 0.25), inv216 = r2(inversion * 0.75);
  const amortMes217 = inv217 * 0.25 / 12, amortMes216 = inv216 * (mix('amortizacion') / 100) / 12;
  gasto(y0, m0, 5, 'Compra de equipos informáticos y herramientas', '217', inv217, { tag: 'inmovilizado' });
  gasto(y0, m0, 5, 'Compra de mobiliario, maquinaria y adecuación del negocio', '216', inv216, { tag: 'inmovilizado' });
  // las inversiones no son gasto: se pasan de 217/216 reales (la función gasto usa la cuenta indicada)
  const mktLanz = (mod === 'online' ? 450 : 350) * pi0;
  gasto(y0, m0, 6, 'Campaña de lanzamiento (publicidad inicial)', '627', mktLanz);

  // stock inicial
  prods.filter(p => p.tipo === 'producto').forEach(p => {
    const forecast = Math.max(2, esperada(p, 2, y0, 0) * 1.0);
    const u = Math.ceil(forecast * sec.stock_meses);
    const c = p.coste * indice(F, p.indice_coste, y0, 0);
    const v = r2(u * c);
    const iv = r2(v * ivaCompra(p) / 100);
    post(y0, m0, 7, 'Compra inicial de mercaderías: ' + p.nombre, [['300', v, 0], ['472', iv, 0], ['572', 0, v + iv]], 'compras');
    addQ(ivaSop, qid(y0, m0), iv);
    stock[p.id].u += u; stock[p.id].v += v;
  });

  // --------------------------------------------------------------- BUCLE MENSUAL
  let mood = 0, quiebra = null, negMeses = 0, shortMeses = 0;
  let ahorrosPers = Math.max(0, (enun.ahorros || 0) - capital);
  const profitMes = [];       // beneficio contable mensual (antes de IS)
  const ytdProfit = {};       // año -> beneficio acumulado (ledger 6/7 sin IS)
  const pagos130 = {};        // año -> pagado
  let carryIVA = 0, binPend = 0, periodosPos = 0;
  const mensual = [];
  const retirosMes = [];
  const sueldoAdminInfo = [];
  let idxCuotaPlan = 0;

  const sumaYtd = (y, hastaM) => {
    // beneficio contable acumulado del año hasta hastaM inclusive, calculado del libro diario
    let ing = 0, gas = 0;
    for (let i = asientos.length - 1; i >= 0; i--) {
      const a = asientos[i]; const ay = +a.fecha.slice(0, 4), am = +a.fecha.slice(5, 7) - 1;
      if (ay < y) break;
      if (ay !== y || am > hastaM) continue;
      for (const l of a.lineas) {
        if (l[0] === '700' || l[0] === '705') ing += l[2] - l[1];
        else if (GASTOS.indexOf(l[0]) >= 0 && l[0] !== '630') gas += l[1] - l[2];
      }
    }
    return ing - gas;
  };

  for (let idx = startIdx; idx <= endIdx && !quiebra; idx++) {
    const y = Math.floor(idx / 12), m = idx % 12, t = idx - startIdx;
    const pi = indice(F, 'ipc', y, m), ei = indice(F, 'energia', y, m);
    const A = anioFiscal(F, y);
    const idxMap = { general: pi, energia: ei, alimentacion: indice(F, 'alimentacion', y, m) };
    mood = clamp(0.55 * mood + (R() - 0.5) * 0.10, -0.12, 0.12);
    const lam = (1 + mood) * eventoFactor(y, m);
    const q = qid(y, m);
    const info = { idx, y, m };

    // 1) reposición de stock
    prods.filter(p => p.tipo === 'producto' && t > 0).forEach(p => {
      const h = hist[p.id];
      const last3 = h.slice(-3);
      const avg = last3.length ? sum(last3) / last3.length : 0;
      const est = F.estacionalidad[p.estacionalidad] || F.estacionalidad.constante;
      const prevMeans = [1, 2, 3].map(k => est[(m - k + 12) % 12]);
      const seasonal = est[m] / (sum(prevMeans) / 3);
      const forecast = Math.max(1, avg * seasonal * 1.1);
      const target = Math.ceil(forecast * sec.stock_meses);
      const need = Math.max(0, target - stock[p.id].u);
      if (need > 0) {
        const c = p.coste * idxMap[p.indice_coste] * (1 + (R() - 0.5) * 0.05);
        const v = r2(need * c);
        const iv = r2(v * ivaCompra(p) / 100);
        post(y, m, 3, 'Compra de mercaderías: ' + p.nombre + ' (' + need + ' ' + p.unidad + ')', [['300', v, 0], ['472', iv, 0], ['572', 0, v + iv]], 'compras');
        addQ(ivaSop, q, iv);
        stock[p.id].u += need; stock[p.id].v += v;
      }
    });

    // 2) ventas (con límite de capacidad de trabajo: titular + empleados)
    let pot = 0;
    prods.forEach(p => { pot += esperada(p, t, y, m) * lam * p.precio * pi; });
    const capRev = (1 + emp.empleados) * sec.cap_persona * pi * (mod === 'online' ? 1.15 : 1);
    const fcap = pot > capRev ? capRev / pot : 1;
    info.fcap = fcap; info.pot = pot;
    let ventasBase = 0, ventasIva = 0, ventasProdBase = 0, ventasServBase = 0, costeVentas = 0, costeServ = 0, unidadesProd = 0, exentas = 0;
    const ivaPorTipo = {};
    const costeServLineas = [];
    prods.forEach(p => {
      let dem = poisson(esperada(p, t, y, m) * lam * fcap, R);
      let u = dem;
      if (p.tipo === 'producto') u = Math.min(dem, stock[p.id].u);
      hist[p.id].push(dem);
      if (u <= 0) { ventasProd[p.id].porMes[idx] = { u: 0, ing: 0 }; return; }
      const precio = r2(p.precio * pi);
      const base = r2(u * precio);
      const iva = r2(base * p.iva / 100);
      ventasBase += base; ventasIva += iva;
      ivaPorTipo[p.iva] = (ivaPorTipo[p.iva] || 0) + iva;
      if (p.iva === 0) exentas += base;
      ventasProd[p.id].unidades += u; ventasProd[p.id].ingresos += base; ventasProd[p.id].porMes[idx] = { u, ing: base };
      if (p.tipo === 'producto') {
        ventasProdBase += base; unidadesProd += u;
        const s = stock[p.id];
        const cu = s.u > 0 ? s.v / s.u : 0;
        const cv = r2(cu * u);
        s.u -= u; s.v = r2(s.v - cv); costeVentas += cv;
      } else {
        ventasServBase += base;
        const cs = r2(u * p.coste * idxMap[p.indice_coste]);
        costeServ += cs;
      }
    });
    ventasBase = r2(ventasBase); ventasIva = r2(ventasIva);
    if (ventasBase > 0) {
      post(y, m, 28, 'Ventas y servicios facturados en ' + F.meses_nombre[m].toLowerCase() + ' (resumen de facturas del mes)',
        [['572', ventasBase + ventasIva, 0], ['700', 0, ventasProdBase], ['705', 0, ventasServBase], ['477', 0, ventasIva]], 'ventas');
      addQ(ivaRep, q, ventasIva); addQ(ivaExenta, q, exentas); addQ(ivaTotal, q, ventasBase);
    }
    if (costeVentas > 0) post(y, m, 28, 'Coste de las mercaderías vendidas en el mes', [['600', costeVentas, 0], ['300', 0, costeVentas]], 'coste');
    if (costeServ > 0) gasto(y, m, 15, 'Materiales y consumibles de los servicios prestados', '602', costeServ);

    // 3) gastos fijos
    const alq = rentF > 0 ? alqMes(y, m) : 0;
    if (alq > 0) gasto(y, m, 5, 'Alquiler del local de ' + F.meses_nombre[m].toLowerCase(), '621', r2(alq), { ret: 19, tag: 'alquiler' });
    const sumi = mix('suministros') * (mod === 'local' ? 1 : (mod === 'domicilio' ? 0.35 : 0.25)) * ei * (0.8 + 0.2 * ub.alquiler_idx);
    gasto(y, m, 10, 'Suministros: luz, agua, internet y teléfono', '628', r2(sumi));
    const seg = (25 + inversion * 0.006) * (mod === 'local' ? 1 : 0.6) * pi / 1;
    gasto(y, m, 10, 'Seguros del negocio', '625', r2(seg / 1.0), { exento: true });
    gasto(y, m, 12, 'Gestoría y asesoría fiscal', '623', r2((esAut ? 55 : 120) * pi));
    const mk = Math.max(60 * pi, sec.marketing / 100 * ventasBase) * (mod === 'online' ? 1.4 : 1);
    gasto(y, m, 14, 'Publicidad y redes sociales', '627', r2(mk));
    if (mod === 'online') gasto(y, m, 14, 'Plataforma web, hosting y herramientas', '629', r2(35 * pi));
    if (mod === 'online' && unidadesProd > 0) gasto(y, m, 20, 'Envíos de pedidos online', '624', r2(unidadesProd * 3.0 * pi));
    if (mod === 'domicilio') gasto(y, m, 16, 'Vehículo y desplazamientos (combustible, mantenimiento)', '624', r2(180 * ei));

    // 4) personal
    const smi = A.smi_14 * 14 / 12;
    if (emp.empleados > 0) {
      const bruto = r2(smi * 1.12), n = emp.empleados;
      const ret = r2(bruto * F.retencion_empleados / 100 * n);
      const ssE = r2(bruto * ssEmpresaPct(F, y) * n);
      post(y, m, 28, `Nóminas de ${F.meses_nombre[m].toLowerCase()}: ${n} empleado(s) y Seguridad Social`,
        [['640', bruto * n, 0], ['642', ssE, 0], ['4751', 0, ret], ['572', 0, bruto * n - ret + ssE]], 'nominas');
      addQ(retQ, q, ret);
    }
    const need = enun.retiro * pi;
    // cuota autónomo (real o del administrador)
    let cuotaPersonal = 0;
    const histP = profitMes.slice(-12);
    const rendEst = histP.length ? Math.max(0, sum(histP) / histP.length) : 0;
    if (t < 12) cuotaPersonal = A.tarifa_plana;
    else if (t < 24 && sum(profitMes.slice(-12)) < A.smi_14 * 14) cuotaPersonal = A.tarifa_plana;
    else cuotaPersonal = cuotaTramo(F, y, rendEst);
    if (esAut) {
      post(y, m, 30, 'Cuota de autónomos (RETA) de ' + F.meses_nombre[m].toLowerCase() + (t < 12 ? ' (tarifa plana)' : ''),
        [['642', cuotaPersonal, 0], ['572', 0, cuotaPersonal]], 'cuota');
    } else {
      const brutoAdm = r2((need + cuotaPersonal) / (1 - F.retencion_administrador / 100));
      const ret = r2(brutoAdm * F.retencion_administrador / 100);
      post(y, m, 28, 'Nómina del administrador de ' + F.meses_nombre[m].toLowerCase() + ' (retención IRPF ' + F.retencion_administrador + '%)',
        [['640', brutoAdm, 0], ['4751', 0, ret], ['572', 0, brutoAdm - ret]], 'nominas');
      addQ(retQ, q, ret);
      sueldoAdminInfo.push({ idx, bruto: brutoAdm, cuotaRETA: cuotaPersonal });
    }
    info.cuotaPersonal = cuotaPersonal;

    // 5) amortización
    const am1 = r2(amortMes217), am2 = r2(amortMes216);
    post(y, m, 30, 'Amortización mensual del inmovilizado', [['681', am1 + am2, 0], ['281', 0, am1 + am2]], 'amort');

    // 6) préstamo
    if (prestamoVivo > 0.01) {
      const interes = r2(prestamoVivo * tipoPrest);
      let princ = r2(cuotaPrestamo - interes);
      if (princ > prestamoVivo) princ = r2(prestamoVivo);
      post(y, m, 30, 'Cuota del préstamo bancario (intereses + amortización)', [['662', interes, 0], ['170', princ, 0], ['572', 0, interes + princ]], 'prestamo');
      prestamoVivo = r2(prestamoVivo - princ);
    }

    // 7) liquidaciones de impuestos (mes siguiente al trimestre)
    if ([0, 3, 6, 9].indexOf(m) >= 0 && idx > startIdx) {
      const py = m === 0 ? y - 1 : y, pq = qid(py, m === 0 ? 11 : m - 1);
      const rep = r2(ivaRep[pq] || 0), sop = r2(ivaSop[pq] || 0);
      const share = (ivaTotal[pq] || 0) > 0 ? (ivaExenta[pq] || 0) / ivaTotal[pq] : 0;
      const nd = r2(sop * share);
      const diff = r2(rep - (sop - nd) - carryIVA);
      if (rep > 0 || sop > 0) {
        const L = [['477', rep, 0], ['634', nd, 0], ['472', 0, sop]];
        if (carryIVA > 0) L.push(['4700', 0, carryIVA]);
        if (diff > 0) L.push(['572', 0, diff]); else if (diff < 0) L.push(['4700', -diff, 0]);
        post(y, m, 20, `Liquidación del IVA del trimestre ${(pq % 4) + 1}/${py} (modelo 303)` + (diff <= 0 ? ' — resultado a compensar' : ''), L, 'iva');
        carryIVA = diff < 0 ? -diff : 0;
      }
      const ret = r2(retQ[pq] || 0);
      if (ret > 0) post(y, m, 20, `Ingreso de retenciones del trimestre ${(pq % 4) + 1}/${py} (modelos 111 y 115)`, [['4751', ret, 0], ['572', 0, ret]], 'retenciones');
      if (esAut) {
        const ytd = sumaYtd(py, m === 0 ? 11 : m - 1);
        const debe = Math.max(0, r2(ytd * F.pago_fraccionado_130 / 100 - (pagos130[py] || 0)));
        if (debe > 0) {
          post(y, m, 20, `Pago fraccionado del IRPF del trimestre ${(pq % 4) + 1}/${py} (modelo 130, ${F.pago_fraccionado_130}% del rendimiento acumulado)`, [['551', debe, 0], ['572', 0, debe]], 'irpf130');
          pagos130[py] = (pagos130[py] || 0) + debe;
        }
      }
    }
    // IRPF anual (junio del año siguiente) / IS (julio)
    if (esAut && m === 5 && y > y0) {
      const py = y - 1;
      const prof = sumaYtd(py, 11);
      const rend = Math.max(0, prof - Math.min(2000, Math.max(0, prof) * 0.05));
      const cuota = Math.max(0, escalaIRPF(F, rend) - escalaIRPF(F, Math.min(rend, minimoPersonal(F, enun.hijos || 0))));
      const resu = r2(cuota - (pagos130[py] || 0));
      if (resu > 0) post(y, m, 25, `Declaración de la Renta ${py} (modelo 100): cuota a ingresar`, [['551', resu, 0], ['572', 0, resu]], 'irpfanual');
      else if (resu < 0) post(y, m, 25, `Declaración de la Renta ${py} (modelo 100): devolución de Hacienda`, [['572', -resu, 0], ['551', 0, -resu]], 'irpfanual');
    }
    if (!esAut && m === 6 && y > y0) {
      const bal = asientos.reduce((s, a) => s + sum(a.lineas.filter(l => l[0] === '4752').map(l => l[2] - l[1])), 0);
      if (bal > 0) post(y, m, 25, `Pago del Impuesto sobre Sociedades ${y - 1} (modelo 200)`, [['4752', bal, 0], ['572', 0, bal]], 'is');
    }
    if (!esAut && m === 11) {
      const prof = sumaYtd(y, 11);
      let tax = 0;
      if (prof <= 0) { binPend += -prof; }
      else {
        const usa = Math.min(binPend, prof); binPend -= usa;
        const base = prof - usa;

  const res = M.simular(e, D, HOY);
  const cont = M.construirContabilidad(e, D, res, HOY);
  const diag = M.diagnostico(e, D, res, cont, HOY);
  SIM = { res, cont, diag, serie: M.serieMensual(cont.asientos, e, res.endIdx) };
  // estado quiebra persistente
  if (res.quiebra && e.estado === 'activa') { e.estado = 'quebrada'; save(); }
  if (!res.quiebra && e.estado === 'quebrada') { e.estado = 'activa'; save(); }
}
const finISO = () => { const i = SIM.res.endIdx; return `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, '0')}-31`; };

const COL = { ing: '#2e7d6b', gas: '#c7503c', ben: '#3b5bdb', caja: '#6f42c1', gris: '#8c9196' };
function ticks(max, min) {
  const span = max - min || 1; const raw = span / 4; const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const t = []; let v = Math.floor(min / step) * step; do { t.push(v); v += step; } while (t[t.length - 1] < max - 1e-9);
  return t;
}
function chartBars(labels, series, h) {
  h = h || 260; const w = 760, pl = 54, pr = 10, pt = 14, pb = 34;
  const all = series.flatMap(s => s.vals); let max = Math.max(1, ...all), min = Math.min(0, ...all);
  const T = ticks(max, min); max = T[T.length - 1]; min = T[0];
  const y = v => pt + (h - pt - pb) * (1 - (v - min) / (max - min || 1));
  const n = labels.length, gw = (w - pl - pr) / Math.max(1, n), bw = Math.max(3, Math.min(28, gw / (series.length + 0.8)));

  T.forEach(t => { s += `<line x1="${pl}" x2="${w - pr}" y1="${y(t)}" y2="${y(t)}" stroke="#e3e5e7"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end" class="ax">${esc(abbr(t))}</text>`; });
  labels.forEach((l, i) => {
    const x0 = pl + gw * i + (gw - bw * series.length) / 2;
    series.forEach((se, k) => {
      const v = se.vals[i]; const yy = y(Math.max(v, 0)), y0 = y(0);
      s += `<rect x="${x0 + k * bw}" y="${Math.min(yy, y(v))}" width="${bw - 1}" height="${Math.max(1, Math.abs(y(v) - y0))}" fill="${se.color}" rx="2"><title>${esc(l)} · ${esc(se.name)}: ${eur0(v)}</title></rect>`;
    });
    if (n <= 14 || i % Math.ceil(n / 14) === 0) s += `<text x="${pl + gw * i + gw / 2}" y="${h - 12}" text-anchor="middle" class="ax">${esc(l)}</text>`;
  });
  return s + '</svg>' + legend(series);
}
function chartLine(labels, series, h) {
  h = h || 260; const w = 760, pl = 54, pr = 10, pt = 14, pb = 34;
  const all = series.flatMap(s => s.vals); let max = Math.max(1, ...all), min = Math.min(0, ...all);
  const T = ticks(max, min); max = T[T.length - 1]; min = T[0];
  const y = v => pt + (h - pt - pb) * (1 - (v - min) / (max - min || 1));
  const n = labels.length, x = i => pl + (w - pl - pr) * (n <= 1 ? 0.5 : i / (n - 1));

}

function resizeLogo(file) {
  return new Promise(res => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 240 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.max(1, im.width * k); c.height = Math.max(1, im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; im.onerror = () => res(''); im.src = fr.result; }; fr.readAsDataURL(file); });
}

/* ------------------------------------------------------------- selects desplegables y tablas */
function cerrarMenus() { document.querySelectorAll('.dd-menu').forEach(m => m.remove()); document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open')); }
function mejorar(root) {
  root = root || document;
  root.querySelectorAll('select').forEach(sel => {
    if (sel.dataset.dd) return; sel.dataset.dd = 1; sel.style.display = 'none';
    const d = document.createElement('div'); d.className = 'dd'; d.tabIndex = 0;
    const lab = () => { const o = sel.options[sel.selectedIndex]; return o ? o.textContent : ''; };
    d.innerHTML = `<span class="dd-l">${esc(lab())}</span><svg viewBox="0 0 20 20" width="14" height="14"><path d="M5 7l5 6 5-6z" fill="currentColor"/></svg>`;
    sel.parentNode.insertBefore(d, sel);
    const abrir = () => {
      const ya = d.classList.contains('open'); cerrarMenus(); if (ya) return;
      d.classList.add('open');
      const m = document.createElement('div'); m.className = 'dd-menu';
      [...sel.options].forEach((o, i) => { const it = document.createElement('div'); it.className = 'dd-i' + (i === sel.selectedIndex ? ' on' : ''); it.innerHTML = `<span>${esc(o.textContent)}</span>${i === sel.selectedIndex ? '<b>✓</b>' : ''}`;
        it.addEventListener('mousedown', ev => { ev.preventDefault(); sel.selectedIndex = i; d.querySelector('.dd-l').textContent = lab(); cerrarMenus(); sel.dispatchEvent(new Event('change', { bubbles: true })); });
        m.appendChild(it); });
      document.body.appendChild(m);
      const r = d.getBoundingClientRect(); m.style.minWidth = r.width + 'px';
      const h = m.offsetHeight; const abajo = window.innerHeight - r.bottom;
      m.style.left = Math.min(r.left, window.innerWidth - m.offsetWidth - 8) + 'px';
      m.style.top = (abajo < Math.min(h, 260) && r.top > abajo ? r.top - Math.min(h, 320) - 4 : r.bottom + 4) + 'px';
      const on = m.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    };
    d.addEventListener('click', ev => { ev.stopPropagation(); abrir(); });
    d.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowDown') { ev.preventDefault(); abrir(); } if (ev.key === 'Escape') cerrarMenus(); });
  });
  root.querySelectorAll('table.tbl').forEach(t => {
    if (t.closest('.inv')) return;
    if (!t.parentElement.classList.contains('tblwrap')) { const w = document.createElement('div'); w.className = 'tblwrap' + (t.closest('.scroll') ? ' in' : ''); t.parentNode.insertBefore(w, t); w.appendChild(t); }
    t.querySelectorAll('td.r').forEach(td => { if (/^\s*[−-]\s*[\d]/.test(td.textContent)) td.classList.add('neg'); else if (/^\s*0,00\s*€\s*$/.test(td.textContent)) td.classList.add('zero'); });
  });
}
document.addEventListener('click', ev => { if (!ev.target.closest('.dd-menu')) cerrarMenus(); });
window.addEventListener('scroll', cerrarMenus, true); window.addEventListener('resize', cerrarMenus);
